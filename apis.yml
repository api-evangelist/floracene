description: Floracene is a Y Combinator (Summer 2026) health-tech startup that optimizes medical-device
  purchasing for independent surgery centers. Its platform surfaces clinically equivalent implant options
  based on a physician's manufacturer contracts, helping independent orthopedic and spine surgery centers
  choose lower-cost, clinically interchangeable devices and recoup an estimated 20-30% of implant spend
  while protecting case margins and patient care. US surgery centers spend roughly $7 billion annually on
  implants, which represent 40-60% of procedure costs. The company is at an early, pre-product stage with
  a placeholder marketing site and no public API, developer portal, or documentation at this time.
